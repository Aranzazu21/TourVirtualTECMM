<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtual TECMM Zapopan</title>
    
    <!-- Librería Pannellum JS y CSS para el visor 360 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Estilos locales -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Encabezado de la App -->
    <header class="app-header">
        <h1>TECMM Campus Zapopan</h1>
        <p id="tvLugarActual">Cargando ubicación...</p>
    </header>

    <!-- Menú de navegación dinámico cargado desde Firestore -->
    <nav id="menuNavegacion" class="menu-container">
        <!-- Los botones de los edificios se generarán dinámicamente aquí -->
    </nav>

    <!-- Contenedor del Visor 360 -->
    <main class="viewer-container">
        <div id="panorama"></div>
    </main>

    <!-- Tarjeta informativa inferior -->
    <section class="info-card">
        <h2 id="tvTituloLugar">Cargando...</h2>
        <p id="tvDescripcion">Selecciona un punto en la barra superior o usa las flechas en la vista para avanzar.</p>
    </section>

    <!-- Script principal con soporte para Firebase Módulos -->
    <script type="module" src="app.js"></script>
</body>
</html>
