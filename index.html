<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtual 360° TECMM Zapopan</title>

    <!-- Hojas de Estilo -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>

    <!-- Encabezado / Menú Navegación Flotante -->
    <header class="top-bar">
        <div class="brand">
            <span id="tvLugarActual" class="badge">Cargando...</span>
        </div>

        <nav class="nav-buttons">
            <button class="btn-nav">Entrada Principal</button>
            <button class="btn-nav">Ciencias Básicas</button>
            <button class="btn-nav">Ing. Industrial</button>
            <button class="btn-nav">Sistemas</button>
        </nav>

        <div class="filter-box">
            <select id="selectCarreras" class="custom-select">
                <option value="todas">Ver todas las carreras</option>
                <option value="sistemas">Sistemas Computacionales</option>
                <option value="industrial">Ing. Industrial</option>
                <option value="basicas">Ciencias Básicas</option>
                <option value="arquitectura">Arquitectura</option>
                <option value="electromecanica">Electromecánica</option>
            </select>
        </div>
    </header>

    <!-- Visor 360° WebGL -->
    <main id="panorama"></main>

    <!-- Tarjeta de Información -->
    <div class="info-card">
        <h2 id="tvTituloLugar">Cargando Escena...</h2>
        <p id="tvDescripcion">Por favor espera mientras se inicializa el visor 360°.</p>
    </div>

    <!-- Interfaz del Chatbot -->
    <div id="chatWidget" class="chat-widget">
        <div class="chat-header">
            <span>Asistente Virtual TECMM</span>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="chat-message bot">¡Hola! ¿Qué edificio o área del campus deseas visitar?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ej. Llévame a Sistemas..." />
            <button id="btnSendChat">Enviar</button>
        </div>
    </div>

    <!-- Carga de scripts -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
