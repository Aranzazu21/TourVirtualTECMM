<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tour Virtual 360° TECMM Zapopan</title>

    <!-- Hojas de Estilo -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    
    <!-- Logo Institucional Flotante (Fuera de la barra) -->
    <img src="assets/imagenes/tecmm.png" alt="Logo TECMM" id="logoTecmm" class="logo-flotante">

    <!-- Encabezado Morado Compacto -->
    <header class="top-bar compact">
        
        <span id="tvLugarActual" class="badge-lugar">Cargando...</span>

        <div class="nav-controls">
            <!-- Filtro de Categorías -->
            <select id="filtroCampus" class="filtro-select">
                <option value="Todas">👁️ Todas las áreas</option>
                <option value="Accesos">🚪 Accesos</option>
                <option value="Andadores">🚶 Andadores</option>
                <option value="Edificios">🏢 Edificios</option>
                <option value="Aulas">🏫 Aulas</option>
                <option value="Laboratorios">🔬 Laboratorios</option>
                <option value="Servicios">☕ Servicios</option>
            </select>

            <!-- Menú Desplegable -->
            <div class="nav-dropdown-container">
                <button id="btnToggleMenu" class="btn-explorar">📍 Explorar Campus ▼</button>
                <div id="menuNavegacion" class="dropdown-content">
                    <!-- Se inyectan las ubicaciones dinámicamente -->
                </div>
            </div>
        </div>
    </header>

        <!-- Fila Inferior: Filtro y Botón de Explorar -->
        <div class="nav-controls">
            <select id="filtroCampus" class="filtro-select">
                <option value="Todas">👁️ Todas las áreas</option>
                <option value="Accesos">🚪 Accesos</option>
                <option value="Andadores">🚶 Andadores</option>
                <option value="Edificios">🏢 Edificios</option>
                <option value="Aulas">🏫 Aulas</option>
                <option value="Laboratorios">🔬 Laboratorios</option>
                <option value="Servicios">☕ Servicios</option>
            </select>

            <div class="nav-dropdown-container">
                <button id="btnToggleMenu" class="btn-explorar">📍 Explorar Campus ▼</button>
                <div id="menuNavegacion" class="dropdown-content">
                    <!-- Se inyectan las ubicaciones dinámicamente -->
                </div>
            </div>
        </div>
    </header>

    <!-- Visor 360° WebGL -->
    <main id="panorama"></main>

    <!-- Tarjeta de Información -->
    <div class="info-card">
        <h2 id="tvTituloLugar">Cargando Escena...</h2>
        <p id="tvDescripcion">Por favor espera mientras se inicializa el visor 360°.</p>
    </div>

    <!-- Botón Flotante Chatbot (Derecha) -->
    <button id="btnAbrirChat" class="chat-floating-btn" title="Abrir Asistente">
        <span>💬</span> Asistente Virtual
    </button>

    <!-- Botón Flotante Buzón (Izquierda) -->
    <button id="btnAbrirBuzon" class="buzon-floating-btn" title="Enviar queja o sugerencia">
        ✉️ Buzón
    </button>

    <!-- Interfaz del Chatbot -->
    <div id="chatWidget" class="chat-widget minimizado">
        <div class="chat-header" style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <button id="btn-mic" type="button" style="background: none; border: none; cursor: pointer; font-size: 0.95rem; color: #1B396A; font-weight: bold; display: flex; align-items: center;" title="Presiona la barra espaciadora o haz clic para hablar">
                    <span id="t-btnMic">🎙️ Hablar</span>
                </button>
                <button id="btnLeerOpciones" type="button" style="background: none; border: none; cursor: pointer; font-size: 1rem; color: #1B396A;" title="Escuchar opciones en voz alta">🔊</button>
            </div>
            
            <span style="font-weight: 600; font-size: 0.95rem;">Asistente TECMM</span>
            <button id="btnMinimizarChat" class="btn-chat-toggle" title="Minimizar">✕</button>
        </div>

        <div id="chatMessages" class="chat-messages">
            <div class="chat-message bot">¡Hola! ¿Qué edificio o área del campus deseas visitar? Haz clic en 🎙️ Hablar o presiona la Barra Espaciadora para dictarme.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ej. Llévame a Sistemas..." autocomplete="off" />
            <button id="btnSendChat">Enviar</button>
        </div>
    </div>
   
    <!-- Modal Buzón de Quejas y Sugerencias -->
    <div id="modalBuzon" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; padding: 15px;">
        <div style="background: #fff; border-radius: 12px; max-width: 420px; width: 100%; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); font-family: sans-serif;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #1B396A;">✉️ Buzón de Quejas y Sugerencias</h3>
                <button id="btnCerrarBuzon" type="button" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #666;">✕</button>
            </div>

            <form id="formBuzon" style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label style="font-size: 0.85rem; font-weight: bold; color: #333;">Tipo de comentario:</label>
                    <select id="buzonTipo" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-top: 4px;">
                        <option value="Sugerencia">💡 Sugerencia de mejora</option>
                        <option value="Queja">⚠️ Queja o reporte</option>
                        <option value="Accesibilidad">♿ Accesibilidad / Voz</option>
                        <option value="Otro">💬 Otro comentario</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.85rem; font-weight: bold; color: #333;">Tu Nombre o Matrícula (Opcional):</label>
                    <input type="text" id="buzonRemitente" placeholder="Anónimo" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-top: 4px; box-sizing: border-box;">
                </div>
                <div>
                    <label style="font-size: 0.85rem; font-weight: bold; color: #333;">Mensaje:</label>
                    <textarea id="buzonMensaje" rows="4" required placeholder="Describe tu queja o sugerencia sobre el recorrido o el campus..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-top: 4px; box-sizing: border-box; resize: vertical;"></textarea>
                </div>
                <button type="submit" id="btnEnviarBuzon" style="background: #1B396A; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px;">
                    Enviar al Administrador
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
