<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtual 360° TECMM Zapopan</title>

    <!-- Hojas de Estilo -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <!-- Logo Institucional -->
    <img src="assets/imagenes/tecmm.png" alt="Logo TECMM" id="logoTecmm">

    <!-- Encabezado Compacto Minimalista -->
    <header class="top-bar compact">
        <div class="brand">
            <span id="tvLugarActual" class="badge-lugar">Cargando...</span>
        </div>

        <div class="nav-dropdown-container">
            <button id="btnToggleMenu" class="btn-explorar">📍 Explorar Campus ▼</button>
            <div id="menuNavegacion" class="dropdown-content">
                <!-- Se inyectan las ubicaciones dinámicamente -->
            </div>
        </div>
    </header>

    <!-- Visor 360° WebGL -->
    <main id="panorama"></main>

    <!-- Tarjeta de Información -->
    <div class="info-card">
        <h2 id="tvTituloLugar">Cargando Escena...</h2>
        <p id="tvDescripcion">Por favor espera mientras se inicializa el visor 360°.</p>
    </div>

    <!-- Interfaz del Chatbot -->
    <div id="chatWidget" class="chat-widget minimizado">
        <div class="chat-header" style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <button id="btn-mic" type="button" style="background: none; border: none; cursor: pointer; font-size: 0.95rem; color: #1B396A; font-weight: bold; display: flex; align-items: center;" title="Presiona la barra espaciadora o haz clic para hablar">
                    <span id="t-btnMic">🎙️ Hablar</span>
                </button>
                <button id="btnLeerOpciones" type="button" style="background: none; border: none; cursor: pointer; font-size: 1rem; color: #1B396A;" title="Escuchar opciones en voz alta">
                    🔊
                </button>
            </div>
            
            <span style="font-weight: 600; font-size: 0.95rem;">Asistente TECMM</span>
            <button id="btnMinimizarChat" class="btn-chat-toggle" title="Minimizar">✕</button>
        </div>

        <div id="chatMessages" class="chat-messages">
            <div class="chat-message bot">¡Hola! ¿Qué edificio o área del campus deseas visitar? Haz clic en 🎙️ Hablar o presiona la Barra Espaciadora para dictarme.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ej. Llévame a Sistemas..." autocomplete="off" />
            <button id="btnSendChat">Enviar</button>
        </div>
    </div>
   
    <!-- Botón Flotante para reabrir el Chatbot -->
    <button id="btnAbrirChat" class="chat-floating-btn" title="Abrir Asistente">
        <span>💬</span> Asistente Virtual
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
