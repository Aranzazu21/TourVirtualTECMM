<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso CMS - Tour TECMM</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, rgba(15, 32, 67, 0.75), rgba(27, 57, 106, 0.8)), url('assets/imagenes/tecmm.png') center/cover no-repeat; background-attachment: fixed; padding: 20px; }
        .login-card { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 16px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25); width: 100%; max-width: 380px; padding: 32px 28px; text-align: center; }
        .logo-container { margin-bottom: 16px; }
        .logo-container img { max-width: 150px; height: auto; object-fit: contain; }
        .login-card h2 { color: #1B396A; font-size: 1.45rem; margin-bottom: 18px; font-weight: 700; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 5px; color: #333; }
        .form-group input { width: 100%; padding: 11px 12px; border: 1.5px solid #dcdfe6; border-radius: 8px; background: rgba(255, 255, 255, 0.95); font-size: 0.95rem; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #1B396A; box-shadow: 0 0 0 3px rgba(27, 57, 106, 0.15); background: #fff; }
        .btn-login { width: 100%; padding: 11px; background-color: #1B396A; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        .btn-login:hover { background-color: #12284c; }
        .error-msj { color: #d9534f; font-size: 0.88rem; margin-top: 12px; padding: 8px; background: rgba(217, 83, 79, 0.1); border-radius: 6px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="assets/imagenes/tecmm.png" alt="Logo TECMM">
        </div>

        <h2>Acceso CMS TECMM</h2>
        
        <div class="form-group">
            <label for="txtEmail">Correo Electrónico:</label>
            <input type="email" id="txtEmail" placeholder="admin@tecmm.mx" required>
        </div>
        
        <div class="form-group">
            <label for="txtPassword">Contraseña:</label>
            <input type="password" id="txtPassword" placeholder="••••••••" required>
        </div>
        
        <button id="btnLogin" class="btn-login">Iniciar Sesión</button>
        <p id="msjError" class="error-msj"></p>
    </div>

    <script type="module" src="./adminAuth.js"></script>
</body>
</html>
