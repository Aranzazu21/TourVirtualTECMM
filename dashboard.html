<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard CMS - Tour TECMM</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-body {
            padding: 20px;
            overflow-y: auto;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1B396A;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn-logout {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .panel-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .full-width {
            grid-column: span 2;
        }
        .btn-submit {
            background-color: #1B396A;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 0.9rem;
        }
        th {
            background-color: #e9ecef;
            color: #1B396A;
        }
        .btn-eliminar {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body class="admin-body">

    <header class="admin-header">
        <h2>Panel de Administración (CMS) - Tour TECMM</h2>
        <button id="btnLogout" class="btn-logout">Cerrar Sesión</button>
    </header>

    <section class="panel-card">
        <h3>Registrar Nueva Área / Nodo 360°</h3>
        <form id="formNodo" style="margin-top: 15px;">
            <div class="form-grid">
                <div class="form-group">
                    <label for="idNodo">ID Único (ej. biblioteca, posgrados):</label>
                    <input type="text" id="idNodo" required placeholder="sin_espacios">
                </div>
                <div class="form-group">
                    <label for="nombreNodo">Nombre Visible:</label>
                    <input type="text" id="nombreNodo" required placeholder="Ej. Edificio de Posgrados">
                </div>
                <div class="form-group">
                    <label for="categoriaNodo">Categoría:</label>
                    <select id="categoriaNodo">
                        <option value="Accesos">Accesos</option>
                        <option value="Andadores">Andadores</option>
                        <option value="Aulas">Aulas</option>
                        <option value="Laboratorios">Laboratorios</option>
                        <option value="Servicios">Servicios</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="imagenNodo">Ruta de la Imagen 360°:</label>
                    <input type="text" id="imagenNodo" required placeholder="assets/imagenes/entrada.jpg">
                </div>
                <div class="form-group full-width">
                    <label for="descripcionNodo">Descripción del Área:</label>
                    <textarea id="descripcionNodo" rows="3" required placeholder="Escribe detalles del lugar..."></textarea>
                </div>
            </div>
            <button type="submit" id="btnGuardar" class="btn-submit">Guardar Área en Firestore</button>
            <p id="msjEstado" style="font-weight: bold; margin-top: 10px;"></p>
        </form>
    </section>

    <section class="panel-card">
        <h3>Áreas Registradas en el Campus</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Ruta Imagen</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaNodosBody">
                <tr><td colspan="5">Cargando áreas de Firestore...</td></tr>
            </tbody>
        </table>
    </section>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
